[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowagent"
dynamic = ["version"]
description = "A small personal workflow automation experiment with a visual editor"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "IntelFortis" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
keywords = [
    "workflow",
    "automation",
    "agent",
    "ai",
    "llm",
    "orchestration",
    "dag",
    "pipeline",
    "async",
    "visual-editor",
]
dependencies = [
    "httpx>=0.24.0",
    "anyio>=3.7.0",
    "tenacity>=8.2.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.3.0",
    "mistralai>=0.1.0",
]
database = [
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.28.0",
    "pymongo>=4.4.0",
    "redis>=5.0.0",
    "elasticsearch>=8.10.0",
]
cloud = [
    "boto3>=1.28.0",
    "google-cloud-storage>=2.10.0",
    "azure-storage-blob>=12.17.0",
]
messaging = [
    "slack-sdk>=3.21.0",
    "discord.py>=2.3.0",
    "python-telegram-bot>=20.0",
]
monitoring = [
    "prometheus-client>=0.17.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "pre-commit>=3.3.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
]
ui = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]
all = [
    "flowagent[llm,database,cloud,messaging,monitoring,ui]",
]

[project.urls]
Repository = "https://github.com/IntelFortis/flowagent"
Issues = "https://github.com/IntelFortis/flowagent/issues"
Changelog = "https://github.com/IntelFortis/flowagent/blob/main/CHANGELOG.md"

[project.scripts]
flowagent = "flowagent.cli:main"

[tool.hatch.version]
path = "flowagent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["flowagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.ruff]
target-version = "py39"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.coverage.run]
source = ["flowagent"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "except ImportError",
]
